<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eatsha — 转一转，这顿吃什么" />
    <title>Eatsha — 这顿吃什么</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <button type="button" id="logo-home" class="logo" aria-label="回到首页">
        <img class="logo__icon" src="favicon.svg?v=2" width="18" height="18" alt="" />
        <span>Eatsha</span>
      </button>
    </header>

    <section id="screen-home" class="screen stage is-active">
      <header class="page-intro">
        <p class="page-intro__title">转一转，决定这顿吃什么</p>
      </header>
      <div class="home-actions" role="group" aria-label="大模式选择">
        <button type="button" id="enter-fixed" class="home-action">
          <span class="home-action__title">固定模式</span>
          <span class="home-action__desc">用附近默认菜单直接转</span>
        </button>
        <button type="button" id="enter-custom" class="home-action">
          <span class="home-action__title">自定义模式</span>
          <span class="home-action__desc">自己编辑菜品，再合成转盘</span>
        </button>
      </div>
    </section>

    <section id="screen-edit" class="screen stage stage--edit" hidden>
      <header class="page-intro page-intro--compact">
        <p class="page-intro__title">编辑菜品，合成转盘</p>
      </header>

      <div class="editor">
        <p id="food-count" class="food-count" aria-live="polite">共 0 道菜</p>
        <ul id="food-list" class="food-list" aria-label="菜品列表"></ul>
        <p id="edit-hint" class="edit-hint" hidden></p>
        <div class="editor__actions">
          <button type="button" id="add-food" class="ghost-btn">加一道</button>
          <button type="button" id="reset-foods" class="ghost-btn">恢复默认</button>
        </div>
        <button type="button" id="compose-btn" class="primary-btn">合成转盘</button>
        <button type="button" id="edit-back-home" class="text-btn">返回首页</button>
      </div>
    </section>

    <section id="screen-wheel" class="screen stage" hidden>
      <header class="page-intro page-intro--compact">
        <p id="wheel-tagline" class="page-intro__title">转一转，决定这顿吃什么</p>
      </header>

      <div class="controls" role="group" aria-label="转动模式">
        <div class="mode-switch">
          <button
            type="button"
            class="mode-btn is-active"
            data-spin-mode="normal"
            aria-pressed="true"
          >
            正常模式
          </button>
          <button
            type="button"
            class="mode-btn"
            data-spin-mode="probability"
            aria-pressed="false"
          >
            概率模式
          </button>
        </div>

        <div id="trials-field" class="trials-field" hidden>
          <label class="trials-field__row" for="trials-input">
            <span class="trials-field__label">随机次数</span>
            <input
              id="trials-input"
              class="trials-input"
              type="number"
              inputmode="numeric"
              step="1"
              value="1000"
            />
          </label>
          <p id="trials-hint" class="trials-field__hint"></p>
        </div>
      </div>

      <section class="wheel-scene" aria-label="美食转盘">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="640" height="640" role="img" aria-label="转盘"></canvas>
        <button type="button" id="spin-btn" class="spin-btn" aria-label="开始转动">
          开转
        </button>
      </section>

      <div class="wheel-nav">
        <button type="button" id="wheel-edit" class="text-btn" hidden>改菜品</button>
        <button type="button" id="wheel-back-home" class="text-btn">返回首页</button>
      </div>
    </section>

    <div id="result-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div
        class="modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="result-title"
      >
        <p id="result-eyebrow" class="modal__eyebrow">这顿就吃</p>
        <h2 id="result-title" class="modal__title"></h2>
        <div id="stats-block" class="stats" hidden>
          <canvas id="pie-chart" width="280" height="280" aria-label="结果占比饼图"></canvas>
          <ul id="stats-legend" class="stats__legend"></ul>
        </div>
        <div class="modal__actions">
          <button type="button" id="close-result-btn" class="ghost-btn" data-close>关闭</button>
          <button type="button" id="again-btn" class="again-btn">再转一次</button>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p class="copyright">
        <span>© 2026</span>
        <a
          href="https://github.com/motoish/eatsha"
          target="_blank"
          rel="noopener noreferrer"
        >Eatsha</a>
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
