<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eatsha — 转一转，今天吃什么" />
    <title>Eatsha — 今天吃什么</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="stage">
      <header class="brand">
        <h1 class="brand__name">Eatsha</h1>
        <p class="brand__tagline">转一转，决定今天吃什么</p>
      </header>

      <div class="controls" role="group" aria-label="模式选择">
        <div class="mode-switch">
          <button
            type="button"
            class="mode-btn is-active"
            data-mode="normal"
            aria-pressed="true"
          >
            正常模式
          </button>
          <button
            type="button"
            class="mode-btn"
            data-mode="probability"
            aria-pressed="false"
          >
            概率模式
          </button>
        </div>

        <label id="trials-field" class="trials-field" hidden>
          <span class="trials-field__label">随机次数</span>
          <input
            id="trials-input"
            class="trials-input"
            type="number"
            inputmode="numeric"
            min="12"
            max="9999"
            step="1"
            value="1000"
          />
        </label>
      </div>

      <section class="wheel-scene" aria-label="美食转盘">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="640" height="640" role="img" aria-label="转盘"></canvas>
        <button type="button" id="spin-btn" class="spin-btn" aria-label="开始转动">
          开转
        </button>
      </section>
    </main>

    <div id="result-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div
        class="modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="result-title"
      >
        <p id="result-eyebrow" class="modal__eyebrow">今天就吃</p>
        <h2 id="result-title" class="modal__title"></h2>
        <div id="stats-block" class="stats" hidden>
          <canvas id="pie-chart" width="280" height="280" aria-label="结果占比饼图"></canvas>
          <ul id="stats-legend" class="stats__legend"></ul>
        </div>
        <button type="button" id="again-btn" class="again-btn">再转一次</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
